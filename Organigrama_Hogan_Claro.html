<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Organigrama Hogan · Claro Colombia</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,sans-serif;background:#EEF1F8;color:#111827;min-height:100vh}
:root{--alta:#059669;--alta-bg:#D1FAE5;--media:#EA580C;--media-bg:#FFEDD5;--prof:#0033A0;--prof-bg:#DBEAFE;}

.hdr{background:#0033A0;height:60px;display:flex;align-items:center;padding:0 24px;gap:14px;position:sticky;top:0;z-index:200;box-shadow:0 2px 10px rgba(0,0,0,.25)}
.hdr-logo{width:36px;height:36px;background:#fff;border-radius:9px;display:grid;place-items:center;font-weight:800;color:#0033A0;font-size:1rem;flex-shrink:0}
.hdr h1{color:#fff;font-size:1rem;font-weight:700}
.hdr-sub{color:rgba(255,255,255,.55);font-size:.7rem;margin-top:1px}
.hdr-stats{margin-left:auto;display:flex;gap:20px}
.hs .n{color:#fff;font-size:1.2rem;font-weight:700;line-height:1;text-align:right}
.hs .l{color:rgba(255,255,255,.5);font-size:.62rem;text-transform:uppercase;letter-spacing:.05em;text-align:right}

.tabs{background:#fff;border-bottom:1px solid #E2E6EF;display:flex;padding:0 24px}
.tab{padding:12px 18px;font-size:.82rem;font-weight:600;color:#6B7280;border:none;background:none;cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap;transition:color .15s}
.tab.on{color:#0033A0;border-bottom-color:#0033A0}
.tab span{font-weight:400;color:#9CA3AF;font-size:.75rem;margin-left:5px}

.fbar{background:#fff;border-bottom:1px solid #E2E6EF;padding:10px 24px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.srch{position:relative;flex:1;min-width:180px;max-width:320px}
.srch svg{position:absolute;left:9px;top:50%;transform:translateY(-50%);width:13px;height:13px;color:#9CA3AF;pointer-events:none}
.srch input{width:100%;padding:7px 9px 7px 28px;border:1px solid #D1D5DB;border-radius:8px;font-size:.8rem;outline:none;background:#F9FAFB}
.srch input:focus{border-color:#0033A0;background:#fff}
select.fsel{padding:7px 10px;border:1px solid #D1D5DB;border-radius:8px;font-size:.79rem;background:#F9FAFB;color:#374151;outline:none;cursor:pointer}
.rcount{margin-left:auto;font-size:.72rem;color:#9CA3AF}

.wrap{padding:20px 24px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px}

/* JEFE CARD */
.jcard{background:#fff;border:1px solid #E2E6EF;border-radius:16px;overflow:hidden;cursor:pointer;transition:transform .17s,box-shadow .17s,border-color .17s}
.jcard:hover{transform:translateY(-3px);box-shadow:0 10px 30px rgba(0,51,160,.13);border-color:#C7D2F5}
.jch{padding:14px 16px;position:relative;overflow:hidden}
.jch::after{content:'';position:absolute;right:-15px;top:-15px;width:80px;height:80px;border-radius:50%;background:rgba(255,255,255,.09)}
.jav{width:42px;height:42px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.95rem;color:#fff;flex-shrink:0;background:rgba(255,255,255,.2)}
.jname{color:#fff;font-weight:700;font-size:.85rem;line-height:1.3}
.jcargo{color:rgba(255,255,255,.6);font-size:.69rem;margin-top:2px}
.jtbadge{position:absolute;top:12px;right:14px;background:rgba(255,255,255,.2);color:#fff;padding:3px 9px;border-radius:20px;font-size:.75rem;font-weight:700}
.jch-inner{display:flex;gap:10px;align-items:flex-start}
.jch-radar{flex-shrink:0;margin-left:auto}

.jcb{padding:12px 16px}
.jdir{font-size:.67rem;color:#9CA3AF;font-weight:600;text-transform:uppercase;letter-spacing:.04em;margin-bottom:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* DIST BAR */
.dbar-wrap{margin-bottom:10px}
.dlabel{font-size:.66rem;font-weight:700;color:#9CA3AF;text-transform:uppercase;letter-spacing:.04em;margin-bottom:5px}
.dbar{display:flex;height:7px;border-radius:10px;overflow:hidden;gap:2px;margin-bottom:4px}
.dseg{border-radius:4px;min-width:3px}
.dlegend{display:flex;gap:8px;flex-wrap:wrap}
.dleg-item{display:flex;align-items:center;gap:3px;font-size:.63rem;color:#6B7280}
.dleg-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}

/* TEAM SUMMARY */
.eq-resumen{background:#F8FAFF;border:1px solid #E0E7FF;border-radius:10px;padding:10px 12px;margin-bottom:10px}
.eq-title{font-size:.67rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:#6B7280;margin-bottom:7px}
.eq-row{display:flex;align-items:center;gap:7px;margin-bottom:4px}
.eq-label{font-size:.7rem;color:#374151;width:110px;flex-shrink:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.eq-bar-bg{flex:1;height:5px;background:#E5E7EB;border-radius:10px;overflow:hidden}
.eq-bar-fill{height:100%;border-radius:10px}
.eq-val{font-size:.69rem;font-weight:700;width:24px;text-align:right}
.eq-insight{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.ins{padding:3px 8px;border-radius:20px;font-size:.65rem;font-weight:700}
.ins.best{background:#D1FAE5;color:#065F46}
.ins.weak{background:#FFF7ED;color:#9A3412}

/* MINI TEAM */
.mteam{display:flex;flex-direction:column;gap:3px}
.mmb{display:flex;align-items:center;justify-content:space-between;padding:3px 0;border-bottom:1px solid #F3F4F6;gap:6px}
.mmb:last-child{border-bottom:none}
.mmbn{font-size:.75rem;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:155px}
.mmb.is-jefe .mmbn{color:#0033A0;text-decoration:underline;text-decoration-color:#93C5FD;text-underline-offset:2px;cursor:pointer;font-weight:700}
.mmb.is-jefe .mmbn:hover{color:#1D4ED8}
.jefe-badge{font-size:.58rem;background:#EEF2FF;color:#4338CA;padding:1px 5px;border-radius:10px;font-weight:700;flex-shrink:0;border:1px solid #C7D2FE}
.mmbcargo{font-size:.64rem;color:#9CA3AF;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:155px}

/* vers / clasif pills */
.cpill{padding:2px 7px;border-radius:20px;font-size:.62rem;font-weight:700;white-space:nowrap;flex-shrink:0}
.cpill.ma{background:#E0F2FE;color:#0369A1}.cpill.al{background:#D1FAE5;color:#065F46}
.cpill.mo{background:#FEF3C7;color:#92400E}.cpill.ba{background:#FEE2E2;color:#991B1B}
.cpill.mb{background:#EDE9FE;color:#5B21B6}.cpill.sd{background:#F3F4F6;color:#6B7280}
.vpill{padding:2px 6px;border-radius:10px;font-size:.6rem;font-weight:700;flex-shrink:0}
.vpill.alta{background:var(--alta-bg);color:var(--alta)}
.vpill.media{background:var(--media-bg);color:var(--media)}
.vpill.prof{background:var(--prof-bg);color:var(--prof)}

.jcf{padding:10px 16px;border-top:1px solid #F3F4F6;display:flex;justify-content:space-between;align-items:center;gap:8px}
.vermas{font-size:.73rem;color:#0033A0;font-weight:700}
.morebadge{font-size:.68rem;color:#9CA3AF}
.pdf-btn{font-size:.68rem;font-weight:700;color:#6B7280;background:#F9FAFB;border:1px solid #E5E7EB;border-radius:7px;padding:4px 9px;cursor:pointer;display:flex;align-items:center;gap:4px;transition:background .15s}
.pdf-btn:hover{background:#F3F4F6;color:#374151}
.pdf-btn svg{width:12px;height:12px}

/* MODAL */
.moverlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:500;backdrop-filter:blur(4px);align-items:flex-start;justify-content:center;padding:16px;overflow-y:auto}
.moverlay.open{display:flex}
.modal{background:#fff;border-radius:20px;width:100%;max-width:1060px;box-shadow:0 24px 60px rgba(0,0,0,.3);animation:pop .2s cubic-bezier(.34,1.56,.64,1);margin:auto}
@keyframes pop{from{opacity:0;transform:scale(.93) translateY(16px)}to{opacity:1;transform:none}}
.mhdr{padding:20px 24px;border-radius:20px 20px 0 0;position:relative;overflow:hidden}
.mhdr::before{content:'';position:absolute;right:-50px;top:-50px;width:180px;height:180px;border-radius:50%;background:rgba(255,255,255,.06)}
.mav-lg{width:52px;height:52px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:1.2rem;color:#fff;flex-shrink:0}
.mname{color:#fff;font-size:1.15rem;font-weight:800;letter-spacing:-.02em;line-height:1.2}
.mcargo{color:rgba(255,255,255,.65);font-size:.79rem;margin-top:2px}
.mmeta{color:rgba(255,255,255,.45);font-size:.69rem;margin-top:3px}
.mclose{position:absolute;top:14px;right:14px;width:30px;height:30px;border-radius:8px;background:rgba(255,255,255,.15);border:none;cursor:pointer;color:#fff;font-size:1.1rem;display:grid;place-items:center;z-index:10}
.mclose:hover{background:rgba(255,255,255,.25)}
.mstats{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.mst{background:rgba(255,255,255,.13);padding:7px 13px;border-radius:9px}
.mst .n{color:#fff;font-size:1.2rem;font-weight:800;line-height:1}
.mst .l{color:rgba(255,255,255,.55);font-size:.62rem;text-transform:uppercase;letter-spacing:.04em;margin-top:1px}
.mhdr-inner{display:flex;gap:14px;align-items:flex-start}
.mhdr-radar{flex-shrink:0;margin-left:auto}
.mpdf-btn{position:absolute;top:14px;right:50px;font-size:.68rem;font-weight:700;color:rgba(255,255,255,.8);background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.25);border-radius:7px;padding:4px 10px;cursor:pointer;display:flex;align-items:center;gap:4px}
.mpdf-btn:hover{background:rgba(255,255,255,.25)}

.mbody{overflow:hidden}
.msec{padding:18px 22px;border-bottom:1px solid #F3F4F6}
.msec-title{font-size:.72rem;font-weight:800;text-transform:uppercase;letter-spacing:.07em;color:#9CA3AF;margin-bottom:12px;display:flex;align-items:center;gap:6px}
.msec-dot{width:6px;height:6px;border-radius:50%;background:#0033A0;flex-shrink:0}
.sum-eq-row{display:flex;align-items:center;gap:8px;margin-bottom:5px}
.sum-eq-label{font-size:.72rem;color:#374151;width:155px;flex-shrink:0}
.sum-eq-bg{flex:1;height:6px;background:#F3F4F6;border-radius:10px;overflow:hidden}
.sum-eq-fill{height:100%;border-radius:10px}
.sum-eq-val{font-size:.72rem;font-weight:700;width:26px;text-align:right}
.insights-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.ins-big{padding:5px 10px;border-radius:8px;font-size:.73rem;font-weight:700}
.ins-big.best{background:#D1FAE5;color:#065F46;border:1px solid #A7F3D0}
.ins-big.weak{background:#FFF7ED;color:#9A3412;border:1px solid #FED7AA}

.emp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(275px,1fr));gap:12px;padding:18px 22px}
.ecard{border:1px solid #E5E7EB;border-radius:13px;overflow:hidden;transition:border-color .15s,box-shadow .15s}
.ecard:hover{border-color:#C7D2F5;box-shadow:0 4px 14px rgba(0,51,160,.08)}
.ecard.is-jefe{border:2px solid #818CF8}
.ecard-jefe-link{display:none;align-items:center;gap:5px;padding:6px 14px;background:#EEF2FF;font-size:.71rem;font-weight:700;color:#4338CA;cursor:pointer;border-top:1px solid #C7D2FE}
.ecard-jefe-link:hover{background:#E0E7FF}
.ecard.is-jefe .ecard-jefe-link{display:flex}
.ech{padding:13px 14px 10px;display:flex;gap:10px;align-items:flex-start}
.eav{width:36px;height:36px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.8rem;color:#fff;flex-shrink:0}
.ename{font-size:.8rem;font-weight:700;line-height:1.3;color:#111827}
.ecargo{font-size:.68rem;color:#9CA3AF;margin-top:1px;line-height:1.3}
.ebadges{display:flex;gap:5px;margin-top:5px;flex-wrap:wrap}
.evers{font-size:.62rem;font-weight:700;padding:2px 7px;border-radius:10px}
.evers.alta{background:var(--alta-bg);color:var(--alta)}
.evers.media{background:var(--media-bg);color:var(--media)}
.evers.prof{background:var(--prof-bg);color:var(--prof)}

.comp-sec{padding:6px 14px 14px}
.comp-title{font-size:.63rem;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:#9CA3AF;margin-bottom:6px}
.crow{display:flex;align-items:center;gap:7px;margin-bottom:4px}
.clabel{font-size:.67rem;color:#374151;width:130px;flex-shrink:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cbg{flex:1;height:5px;background:#F3F4F6;border-radius:10px;overflow:hidden}
.cfill{height:100%;border-radius:10px}
.cval{font-size:.68rem;font-weight:800;width:24px;text-align:right}
.pot-row{display:flex;align-items:center;gap:7px;padding:7px 14px;background:#F8FAFF;border-top:1px solid #EEF2FF;border-bottom:1px solid #EEF2FF}
.pot-l{font-size:.68rem;font-weight:700;color:#374151;width:60px;flex-shrink:0}
.pot-bg{flex:1;height:6px;background:#E0E7FF;border-radius:10px;overflow:hidden}
.pot-fill{height:100%;border-radius:10px}
.pot-v{font-size:.72rem;font-weight:800;width:24px;text-align:right}

.nodata{padding:14px;font-size:.75rem;color:#9CA3AF;text-align:center}
.empty{padding:60px 20px;text-align:center;color:#9CA3AF}
.empty p{font-size:.9rem;margin-top:10px}
.mscroll{max-height:calc(92vh - 220px);overflow-y:auto}
.mscroll::-webkit-scrollbar{width:4px}
.mscroll::-webkit-scrollbar-thumb{background:#D1D5DB;border-radius:10px}

.pdf-loading{display:none;position:fixed;inset:0;background:rgba(0,51,160,.7);z-index:9999;align-items:center;justify-content:center;flex-direction:column;gap:12px;color:#fff;font-size:.9rem;font-weight:600;backdrop-filter:blur(4px)}
.pdf-loading.show{display:flex}
.spinner{width:36px;height:36px;border:3px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<header class="hdr">
  <div class="hdr-logo">C</div>
  <div><div style="color:#fff;font-size:1rem;font-weight:700">Organigrama Hogan</div><div class="hdr-sub">Evaluación de Liderazgo · Claro Colombia</div></div>
  <div class="hdr-stats">
    <div class="hs"><div class="n" id="s-total">—</div><div class="l">Evaluados</div></div>
    <div class="hs"><div class="n" id="s-jefes">—</div><div class="l">Jefes</div></div>
    <div class="hs"><div class="n" id="s-alta">—</div><div class="l">Alta Vers.</div></div>
  </div>
</header>

<div class="tabs">
  <button class="tab on" onclick="switchTab('est',this)">Versátil Estratégico <span id="tc-est"></span></button>
  <button class="tab" onclick="switchTab('op',this)">Versátil Operación <span id="tc-op"></span></button>
</div>

<div class="fbar">
  <div class="srch">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
    <input type="text" id="q" placeholder="Buscar jefe, cargo o dirección…" oninput="doFilter()">
  </div>
  <select class="fsel" id="fdir" onchange="doFilter()">
    <option value="">Todas las Direcciones</option>
  </select>
  <select class="fsel" id="fvers" onchange="doFilter()">
    <option value="">Todas las Versatilidades</option>
    <option>Alta Versatilidad</option>
    <option>Media Versatilidad</option>
    <option>Profundidad</option>
  </select>
  <select class="fsel" id="fclasif" onchange="doFilter()">
    <option value="">Todas las Clasificaciones</option>
    <option>Muy Alto</option><option>Alto</option><option>Moderado</option><option>Bajo</option><option>Muy Bajo</option>
  </select>
  <div class="rcount" id="rcount"></div>
</div>

<div class="wrap">
  <div class="grid" id="maingrid"></div>
  <div class="empty" id="empty" style="display:none">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" width="40" height="40"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>
    <p>No se encontraron resultados.</p>
  </div>
</div>

<div class="moverlay" id="moverlay">
  <div class="modal" id="modal-content">
    <div class="mhdr" id="m-hdr">
      <button class="mclose" id="mbtn-close">✕</button>
      <button class="mpdf-btn" id="mbtn-pdf">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="12" height="12"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        Descargar PDF
      </button>
      <div class="mhdr-inner">
        <div style="display:flex;gap:14px;align-items:flex-start;flex:1">
          <div class="mav-lg" id="m-av"></div>
          <div style="flex:1">
            <div class="mname" id="m-name"></div>
            <div class="mcargo" id="m-cargo"></div>
            <div class="mmeta" id="m-meta"></div>
            <div class="mstats" id="m-stats"></div>
          </div>
        </div>
        <div class="mhdr-radar" id="m-radar"></div>
      </div>
    </div>
    <div class="mscroll mbody" id="m-body"></div>
  </div>
</div>

<div class="pdf-loading" id="pdf-loading">
  <div class="spinner"></div>
  <div>Generando PDF…</div>
</div>

<script>

/* ── COLORS ─────────────────────────────────────────────────────────── */
function versColor(v){
  if(!v) return '#6B7280';
  if(v==='Alta Versatilidad') return '#059669';
  if(v==='Media Versatilidad') return '#EA580C';
  if(v==='Profundidad') return '#0033A0';
  return '#6B7280';
}
function versCode(v){
  if(!v) return 'sd';
  if(v==='Alta Versatilidad') return 'alta';
  if(v==='Media Versatilidad') return 'media';
  if(v==='Profundidad') return 'prof';
  return 'sd';
}
function versLabel(v){ return v||'Sin dato'; }
function ini(n){return n.split(' ').filter(w=>w.length>2).slice(0,2).map(w=>w[0]).join('').toUpperCase()||n.slice(0,2).toUpperCase();}
function cc(c){return{' Muy Alto':'ma','Muy Alto':'ma','Alto':'al','Moderado':'mo','Medio':'mo','Bajo':'ba','Muy Bajo':'mb'}[c]||'sd';}
function scol(v){if(v===null||v===undefined)return '#9CA3AF';if(v>=75)return '#059669';if(v>=55)return '#D97706';return '#DC2626';}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

/* Dominant versatilidad color for a team */
function teamDomVers(team){
  const cnt={alta:0,media:0,prof:0};
  team.forEach(m=>{const vc=versCode(m.versatilidad);if(cnt[vc]!==undefined)cnt[vc]++;});
  return Object.entries(cnt).sort((a,b)=>b[1]-a[1])[0][0];
}
const HDR_COLORS={
  alta:'linear-gradient(135deg,#064E3B 0%,#059669 100%)',
  media:'linear-gradient(135deg,#7C2D12 0%,#EA580C 100%)',
  prof:'linear-gradient(135deg,#001A6E 0%,#0044CC 100%)'
};
const RADAR_COL={alta:'#059669',media:'#EA580C',prof:'#0033A0'};

/* ── TEAM STATS ──────────────────────────────────────────────────────── */
function teamStats(team){
  const sums={},counts={};let tp=0,pc=0;
  team.forEach(m=>{
    if(!m.scores)return;
    Object.entries(m.scores).forEach(([k,v])=>{if(v===null||v===undefined||k==='Potencial'||k==='Potential')return;sums[k]=(sums[k]||0)+v;counts[k]=(counts[k]||0)+1;});
    const pk=Object.keys(m.scores||{}).find(k=>k==='Potencial'||k==='Potential');
    if(pk&&m.scores[pk]!=null){tp+=m.scores[pk];pc++;}
  });
  const avgs={};Object.keys(sums).forEach(k=>{avgs[k]=Math.round(sums[k]/counts[k]);});
  const dist={ma:0,al:0,mo:0,ba:0,mb:0,sd:0};
  team.forEach(m=>{dist[cc(m.clasificacion)]++;});
  const sorted=Object.entries(avgs).sort((a,b)=>b[1]-a[1]);
  return{avgs,dist,best:sorted[0],weak:sorted[sorted.length-1],avgPot:pc?Math.round(tp/pc):null};
}

/* ── DIST BAR ────────────────────────────────────────────────────────── */
function distBarHTML(dist,total){
  if(!total)return '';
  const S=[{k:'ma',l:'Muy Alto',h:'#0284C7'},{k:'al',l:'Alto',h:'#059669'},{k:'mo',l:'Moderado',h:'#D97706'},{k:'ba',l:'Bajo',h:'#DC2626'},{k:'mb',l:'Muy Bajo',h:'#7C3AED'},{k:'sd',l:'Sin dato',h:'#D1D5DB'}].filter(s=>dist[s.k]>0);
  return '<div class="dbar-wrap"><div class="dlabel">Distribución del equipo</div><div class="dbar">'+
    S.map(s=>'<div class="dseg" style="flex:'+dist[s.k]+';background:'+s.h+'" title="'+s.l+': '+dist[s.k]+'"></div>').join('')+
    '</div><div class="dlegend">'+S.map(s=>'<div class="dleg-item"><div class="dleg-dot" style="background:'+s.h+'"></div>'+s.l+': '+dist[s.k]+'</div>').join('')+'</div></div>';
}

/* ── RADAR SVG ───────────────────────────────────────────────────────── */
function radarSVG(scores,size,color,bgOpacity){
  size=size||110;color=color||'#0033A0';bgOpacity=bgOpacity||'22';
  const entries=Object.entries(scores).filter(([k,v])=>k!=='Potencial'&&k!=='Potential'&&v!=null);
  if(!entries.length)return '';
  const n=entries.length,cx=size/2,cy=size/2,r=size/2-12;
  const angles=entries.map((_,i)=>Math.PI*2*i/n-Math.PI/2);
  const pts=entries.map(([k,v],i)=>({x:+(cx+r*(v/100)*Math.cos(angles[i])).toFixed(2),y:+(cy+r*(v/100)*Math.sin(angles[i])).toFixed(2)}));
  let svg='<svg width="'+size+'" height="'+size+'" viewBox="0 0 '+size+' '+size+'">';
  [.25,.5,.75,1].forEach(p=>{
    const g=angles.map(a=>+(cx+r*p*Math.cos(a)).toFixed(2)+',+(cy+r*p*Math.sin(a)).toFixed(2)).join(' ');
    svg+='<polygon points="'+g+'" fill="none" stroke="#E5E7EB" stroke-width=".8"/>';
  });
  angles.forEach(a=>{svg+='<line x1="'+cx+'" y1="'+cy+'" x2="'++,(cx+r*Math.cos(a)).toFixed(2)+'" y2="'++,(cy+r*Math.sin(a)).toFixed(2)+'" stroke="#E5E7EB" stroke-width=".7"/>';});
  svg+='<polygon points="'+pts.map(p=>p.x+','+p.y).join(' ')+'" fill="'+color+bgOpacity+'" stroke="'+color+'" stroke-width="1.5" stroke-linejoin="round"/>';
  pts.forEach(p=>{svg+='<circle cx="'+p.x+'" cy="'+p.y+'" r="2.3" fill="'+color+'"/>';});
  svg+='</svg>';
  return svg;
}
function teamRadarSVG(avgs,size,color){return radarSVG(avgs,size,color,'33');}

/* ── COMP BARS ───────────────────────────────────────────────────────── */
function compBarsHTML(scores){
  const entries=Object.entries(scores).filter(([k])=>k!=='Potencial'&&k!=='Potential');
  if(!entries.length)return '<div class="nodata">Sin datos</div>';
  return entries.map(([k,v])=>{
    if(v===null||v===undefined)return '';
    const col=scol(v),sk=k.length>18?k.slice(0,16)+'…':k;
    return '<div class="crow"><div class="clabel" title="'+esc(k)+'">'+esc(sk)+'</div><div class="cbg"><div class="cfill" style="width:'+v+'%;background:'+col+'"></div></div><div class="cval" style="color:'+col+'">'+v+'</div></div>';
  }).join('');
}

  document.getElementById('m-radar').innerHTML=radarHTML;

  const sorted=Object.entries(stats.avgs).sort((a,b)=>b[1]-a[1]);
  const avgBarsFull=sorted.map(([k,v])=>{const c=scol(v),sk=k.length>22?k.slice(0,20)+'…':k;return '<div class="sum-eq-row"><div class="sum-eq-label" title="'+esc(k)+'">'+esc(sk)+'</div><div class="sum-eq-bg"><div class="sum-eq-fill" style="width:'+v+'%;background:'+c+'"></div></div><div class="sum-eq-val" style="color:'+c+'">'+v+'</div></div>';}).join('');
  const best3=sorted.slice(0,3).map(([k,v])=>'<div class="ins-big best">✓ '+esc(k)+': '+v+'</div>').join('');
  const weak3=sorted.slice(-3).reverse().map(([k,v])=>'<div class="ins-big weak">⚠ Oportunidad: '+esc(k)+' ('+v+')</div>').join('');
  const versDistItems=['Alta Versatilidad','Media Versatilidad','Profundidad'].map(v=>{
    const cnt=j.team.filter(m=>m.versatilidad===v).length;
    if(!cnt)return '';
    return '<div class="dleg-item"><div class="dleg-dot" style="background:'+versColor(v)+'"></div>'+esc(v)+': '+cnt+'</div>';
  }).join('');

  const sec1='<div class="msec">'+
    '<div class="msec-title"><div class="msec-dot"></div>Resumen del Equipo</div>'+
    distBarHTML(stats.dist,j.team.length)+
    '<div style="margin-top:6px;display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px">'+versDistItems+'</div>'+
    '<div style="font-size:.7rem;font-weight:700;color:#374151;margin-bottom:8px">Promedio del equipo por competencia</div>'+
    '<div style="display:flex;flex-direction:column;gap:4px">'+avgBarsFull+'</div>'+
    '<div style="margin-top:10px">'+
      '<div style="font-size:.7rem;font-weight:700;color:#059669;margin-bottom:4px">✓ Fortalezas del equipo</div>'+
      '<div class="insights-row">'+best3+'</div>'+
      '<div style="font-size:.7rem;font-weight:700;color:#EA580C;margin-bottom:4px;margin-top:8px">⚠ Oportunidades del equipo</div>'+
      '<div class="insights-row">'+weak3+'</div>'+
    '</div>'+
  '</div>';
  const sec2='<div class="msec"><div class="msec-title"><div class="msec-dot"></div>Resultados Individuales ('+j.team.length+' personas)</div></div>'+
    '<div class="emp-grid">'+j.team.map(empCardHTML).join('')+'</div>';
  document.getElementById('m-body').innerHTML=sec1+sec2;
  document.getElementById('moverlay').classList.add('open');
  document.body.style.overflow='hidden';
}

function closeModal(){
  document.getElementById('moverlay').classList.remove('open');
  document.body.style.overflow='';
  document.getElementById('m-body').innerHTML='';
}

/* ── NAVIGATE TO JEFE ────────────────────────────────────────────────── */
function navigateToJefe(name,tabHint){
  closeModal();
  let targetTab=curTab;
  if(tabHint&&tabHint!==curTab){
    targetTab=tabHint;
    const btn=document.querySelector('.tab'+(tabHint==='est'?':first-child':':last-child'));
    if(btn)switchTab(tabHint,btn);
  }
  setTimeout(()=>{
    const idx=filtered.findIndex(j=>j.name===name);
    if(idx>=0){
      const cards=document.querySelectorAll('.jcard');
      if(cards[idx])cards[idx].scrollIntoView({behavior:'smooth',block:'center'});
      setTimeout(()=>openModal(idx),400);
    } else {
      document.getElementById('q').value=name.split(' ')[0];
      doFilter();
      setTimeout(()=>{const idx2=filtered.findIndex(j=>j.name===name);if(idx2>=0)openModal(idx2);},200);
    }
  },100);
}

/* ── PDF EXPORT ──────────────────────────────────────────────────────── */
async function exportPDF(idx){
  const j=filtered[idx];if(!j)return;
  const loading=document.getElementById('pdf-loading');
  loading.classList.add('show');
  try{
    const{jsPDF}=window.jspdf;
    const doc=new jsPDF({orientation:'portrait',unit:'mm',format:'a4'});
    const W=210,H=297,margin=14;let y=margin;
    const BLUE=[0,51,160],GREEN=[5,150,105],ORANGE=[234,88,12],GRAY=[107,114,128],DARK=[17,24,39],LIGHT=[243,244,246];
    function hexToRgb(hex){const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);return[r,g,b];}
    function scRgb(v){if(v>=75)return GREEN;if(v>=55)return ORANGE;return[220,38,38];}
    function addPage(){doc.addPage();y=margin;}
    function checkY(needed){if(y+needed>H-margin)addPage();}

    // Header
    doc.setFillColor(...BLUE);doc.rect(0,0,W,32,'F');
    doc.setTextColor(255,255,255);doc.setFontSize(16);doc.setFont('helvetica','bold');
    doc.text('Informe Hogan · Claro Colombia',margin,13);
    doc.setFontSize(9);doc.setFont('helvetica','normal');
    doc.text(j.name,margin,20);
    doc.setFontSize(8);
    doc.text((j.cargo||'')+'  ·  '+(j.dir_corp||j.dir_area||''),margin,26);
    y=38;

    const stats=teamStats(j.team);
    const statBoxes=[{l:'A cargo',v:j.team.length},{l:'Alto perf.'  ,v:(stats.dist.ma||0)+(stats.dist.al||0)},{l:'Muy Alto',v:stats.dist.ma||0},...(stats.avgPot!=null?[{l:'Pot. prom.',v:stats.avgPot}]:[])];
    const bw=(W-margin*2)/statBoxes.length-3;
    statBoxes.forEach((s,i)=>{
      const bx=margin+i*(bw+3);
      doc.setFillColor(...LIGHT);doc.roundedRect(bx,y,bw,14,2,2,'F');
      doc.setTextColor(...BLUE);doc.setFont('helvetica','bold');doc.setFontSize(13);
      doc.text(String(s.v),bx+bw/2,y+8,{align:'center'});
      doc.setTextColor(...GRAY);doc.setFont('helvetica','normal');doc.setFontSize(6.5);
      doc.text(s.l.toUpperCase(),bx+bw/2,y+12,{align:'center'});
    });
    y+=20;

    // Dist bar
    doc.setFont('helvetica','bold');doc.setFontSize(8);doc.setTextColor(...DARK);
    doc.text('DISTRIBUCIÓN DEL EQUIPO',margin,y);y+=5;
    const distItems=[{k:'ma',l:'Muy Alto',h:[2,132,199]},{k:'al',l:'Alto',h:[5,150,105]},{k:'mo',l:'Moderado',h:[217,119,6]},{k:'ba',l:'Bajo',h:[220,38,38]},{k:'mb',l:'Muy Bajo',h:[124,58,237]},{k:'sd',l:'Sin dato',h:[209,213,219]}].filter(d=>stats.dist[d.k]>0);
    const totalD=j.team.length,barW=W-margin*2,barH=5;let bxStart=margin;
    distItems.forEach(d=>{const dw=Math.max(stats.dist[d.k]/totalD*barW,0);if(dw<1)return;doc.setFillColor(...d.h);doc.roundedRect(bxStart,y,dw,barH,1,1,'F');bxStart+=dw+1;});
    y+=barH+3;let lx=margin;doc.setFontSize(6.5);doc.setFont('helvetica','normal');
    distItems.forEach(d=>{doc.setFillColor(...d.h);doc.circle(lx+1.5,y+1,1.5,'F');doc.setTextColor(...GRAY);doc.text(d.l+': '+stats.dist[d.k],lx+5,y+2.5);lx+=doc.getTextWidth(d.l+': '+stats.dist[d.k])+12;if(lx>W-margin-20){lx=margin;y+=6;}});
    y+=10;

    // Competency averages
    doc.setFont('helvetica','bold');doc.setFontSize(8);doc.setTextColor(...DARK);
    doc.text('PROMEDIO DEL EQUIPO POR COMPETENCIA',margin,y);y+=5;
    const sorted=Object.entries(stats.avgs).sort((a,b)=>b[1]-a[1]);
    sorted.forEach(([k,v])=>{
      checkY(7);
      const col=scRgb(v);
      doc.setFont('helvetica','normal');doc.setFontSize(7);doc.setTextColor(...DARK);
      doc.text(k.length>28?k.slice(0,26)+'…':k,margin,y+2);
      const barStart=margin+65,barEnd=W-margin-10;
      doc.setFillColor(...LIGHT);doc.roundedRect(barStart,y-1.5,barEnd-barStart,4,1,1,'F');
      doc.setFillColor(...col);doc.roundedRect(barStart,y-1.5,(barEnd-barStart)*v/100,4,1,1,'F');
      doc.setFont('helvetica','bold');doc.setFontSize(7);doc.setTextColor(...col);
      doc.text(String(v),barEnd+2,y+2);
      y+=6;
    });
    y+=4;

    // Strengths & Opportunities
    checkY(24);
    doc.setFont('helvetica','bold');doc.setFontSize(8);doc.setTextColor(...GREEN);
    doc.text('✓ FORTALEZAS',margin,y);y+=5;
    sorted.slice(0,3).forEach(([k,v])=>{
      doc.setFillColor(209,250,229);doc.roundedRect(margin,y,W-margin*2,7,1.5,1.5,'F');
      doc.setFont('helvetica','normal');doc.setFontSize(7);doc.setTextColor(6,95,70);
      doc.text('✓ '+k+': '+v,margin+3,y+4.5);y+=9;
    });
    y+=3;checkY(24);
    doc.setFont('helvetica','bold');doc.setFontSize(8);doc.setTextColor(...ORANGE);
    doc.text('⚠ OPORTUNIDADES',margin,y);y+=5;
    sorted.slice(-3).reverse().forEach(([k,v])=>{
      doc.setFillColor(255,247,237);doc.roundedRect(margin,y,W-margin*2,7,1.5,1.5,'F');
      doc.setFont('helvetica','normal');doc.setFontSize(7);doc.setTextColor(154,52,18);
      doc.text('⚠ '+k+': '+v,margin+3,y+4.5);y+=9;
    });
    y+=6;

    // Individual results
    addPage();
    doc.setFillColor(...BLUE);doc.rect(0,0,W,10,'F');
    doc.setTextColor(255,255,255);doc.setFont('helvetica','bold');doc.setFontSize(9);
    doc.text('RESULTADOS INDIVIDUALES ('+j.team.length+' personas)',margin,7);
    y=16;

    j.team.forEach((m,mi)=>{
      checkY(48);
      const mColHex=versColor(m.versatilidad);
      const mColRgb=hexToRgb(mColHex);
      doc.setFillColor(...mColRgb);doc.roundedRect(margin,y,W-margin*2,9,2,2,'F');
      doc.setTextColor(255,255,255);doc.setFont('helvetica','bold');doc.setFontSize(8.5);
      doc.text((mi+1)+'. '+(m.name.length>40?m.name.slice(0,38)+'…':m.name),margin+3,y+6);
      doc.setFontSize(7);doc.text(m.clasificacion||'Sin dato',W-margin-3,y+6,{align:'right'});
      y+=11;
      doc.setFont('helvetica','normal');doc.setFontSize(7);doc.setTextColor(...GRAY);
      doc.text((m.cargo||'')+(m.versatilidad?' · '+m.versatilidad:''),margin,y);y+=5;
      const compE=Object.entries(m.scores||{}).filter(([k])=>k!=='Potencial'&&k!=='Potential');
      if(compE.length){
        const colsPerRow=2,rowH=5.5,colW=(W-margin*2)/colsPerRow;
        compE.forEach(([k,v],ci)=>{
          if(v===null||v===undefined)return;
          checkY(rowH+1);
          const col2=scRgb(v);
          const cx2=margin+(ci%colsPerRow)*colW;
          if(ci>0&&ci%colsPerRow===0)y+=rowH;
          const sk=k.length>16?k.slice(0,14)+'…':k;
          doc.setFont('helvetica','normal');doc.setFontSize(6);doc.setTextColor(...DARK);
          doc.text(sk,cx2,y+2);
          const bs=cx2+42,bw2=colW-52;
          doc.setFillColor(...LIGHT);doc.roundedRect(bs,y-1,bw2,3.5,1,1,'F');
          doc.setFillColor(...col2);doc.roundedRect(bs,y-1,bw2*v/100,3.5,1,1,'F');
          doc.setFont('helvetica','bold');doc.setFontSize(6);doc.setTextColor(...col2);
          doc.text(String(v),cx2+colW-3,y+2,{align:'right'});
        });
        if(compE.length%colsPerRow!==0||compE.length>0)y+=rowH;
      }
      const pk=Object.keys(m.scores||{}).find(k=>k==='Potencial'||k==='Potential');
      const pv=pk?m.scores[pk]:null;
      if(pv!=null){
        checkY(6);
        doc.setFont('helvetica','bold');doc.setFontSize(6.5);doc.setTextColor(...BLUE);
        doc.text('Potencial: '+pv,margin,y+2);
        const pb=margin+28,pbW=W-margin*2-28-10;
        doc.setFillColor(224,231,255);doc.roundedRect(pb,y-1,pbW,3.5,1,1,'F');
        doc.setFillColor(...BLUE);doc.roundedRect(pb,y-1,pbW*pv/100,3.5,1,1,'F');
        y+=5;
      }
      y+=5;
    });

    const totalPages=doc.getNumberOfPages();
    for(let p=1;p<=totalPages;p++){
      doc.setPage(p);
      doc.setFillColor(249,250,251);doc.rect(0,H-8,W,8,'F');
      doc.setTextColor(...GRAY);doc.setFontSize(6);doc.setFont('helvetica','normal');
      doc.text('Claro Colombia · Evaluación Hogan · '+new Date().toLocaleDateString('es-CO'),margin,H-3);
      doc.text('Pág. '+p+' / '+totalPages,W-margin,H-3,{align:'right'});
    }
    doc.save('Hogan_'+j.name.replace(/\s+/g,'_').slice(0,30)+'.pdf');
  }catch(e){console.error(e);alert('Error generando PDF: '+e.message);}
  loading.classList.remove('show');
}

/* ── EVENT DELEGATION ────────────────────────────────────────────────── */
document.addEventListener('click',function(e){
  if(e.target.id==='mbtn-close'||e.target.id==='moverlay'){closeModal();return;}
  if(e.target.id==='mbtn-pdf'||e.target.closest('#mbtn-pdf')){if(currentModalIdx>=0)exportPDF(currentModalIdx);return;}
  const pdfBtn=e.target.closest('.pdf-btn');
  if(pdfBtn){e.stopPropagation();exportPDF(parseInt(pdfBtn.dataset.pdfIdx,10));return;}
  const jLink=e.target.closest('.ecard-jefe-link');
  if(jLink){navigateToJefe(jLink.dataset.jefeName,jLink.dataset.jefeTab);return;}
  const mmb=e.target.closest('.mmb.is-jefe');
  if(mmb){e.stopPropagation();navigateToJefe(mmb.dataset.jefeName,'');return;}
  const card=e.target.closest('.jcard');
  if(card){openModal(parseInt(card.dataset.idx,10));return;}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});

/* ── FILTER / RENDER ─────────────────────────────────────────────────── */
function doFilter(){
  const q=document.getElementById('q').value.toLowerCase().trim();
  const dir=document.getElementById('fdir').value;
  const vers=document.getElementById('fvers').value;
  const clasif=document.getElementById('fclasif').value;
  filtered=curData.filter(j=>{
    const mq=!q||j.name.toLowerCase().includes(q)||(j.cargo||'').toLowerCase().includes(q)||(j.dir_corp||'').toLowerCase().includes(q)||(j.dir_area||'').toLowerCase().includes(q);
    const md=!dir||j.dir_corp===dir||j.dir_area===dir||j.gerencia===dir;
    const mv=!vers||j.team.some(m=>m.versatilidad===vers);
    const mc=!clasif||j.team.some(m=>m.clasificacion===clasif);
    return mq&&md&&mv&&mc;
  });
  renderGrid();
}

function populateDirFilter(){
  const dirs=[...new Set(curData.map(j=>j.dir_corp||j.dir_area).filter(Boolean))].sort();
  const sel=document.getElementById('fdir');
  sel.innerHTML='<option value="">Todas las Direcciones</option>';
  dirs.forEach(d=>{const o=document.createElement('option');o.value=d;o.textContent=d.length>45?d.slice(0,42)+'…':d;sel.appendChild(o);});
}

function renderGrid(){
  const grid=document.getElementById('maingrid');
  const empty=document.getElementById('empty');
  if(!filtered.length){grid.innerHTML='';empty.style.display='block';document.getElementById('rcount').textContent='';return;}
  empty.style.display='none';
  grid.innerHTML=filtered.map((j,i)=>jefeCardHTML(j,i)).join('');
  document.getElementById('rcount').textContent=filtered.length+' jefe'+(filtered.length!==1?'s':'')+' · '+filtered.reduce((a,j)=>a+j.team.length,0)+' evaluados';
}

function updateHeaderStats(){
  const all=curData.flatMap(j=>j.team);
  document.getElementById('s-total').textContent=all.length;
  document.getElementById('s-jefes').textContent=curData.length;
  document.getElementById('s-alta').textContent=all.filter(m=>m.versatilidad==='Alta Versatilidad').length;
}

function switchTab(tab,btn){
  document.querySelectorAll('.tab').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on');
  curTab=tab;curData=DATA[tab];
  document.getElementById('q').value='';
  document.getElementById('fdir').value='';
  document.getElementById('fvers').value='';
  document.getElementById('fclasif').value='';
  filtered=[...curData];
  populateDirFilter();updateHeaderStats();renderGrid();
}

(function(){
  document.getElementById('tc-est').textContent='('+DATA.est.length+')';
  document.getElementById('tc-op').textContent='('+DATA.op.length+')';
  filtered=[...curData];
  populateDirFilter();updateHeaderStats();renderGrid();
})();
</script>
