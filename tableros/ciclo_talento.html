<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
.wrap{max-width:1400px;margin:0 auto;padding:20px}
.kpi-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:24px}
.kpi{background:var(--card-bg);border:1px solid var(--border);border-radius:14px;padding:20px;text-align:center}
.kpi-val{font-size:2rem;font-weight:800;line-height:1}
.kpi-label{font-size:.72rem;color:var(--text3);text-transform:uppercase;letter-spacing:.04em;margin-top:6px}
.kpi-icon{width:40px;height:40px;border-radius:10px;display:inline-grid;place-items:center;margin-bottom:8px;font-size:1.2rem}
.section{background:var(--card-bg);border:1px solid var(--border);border-radius:14px;padding:24px;margin-bottom:20px}
.section h2{font-size:1rem;font-weight:700;margin-bottom:16px;display:flex;align-items:center;gap:8px}
.section h2 svg{width:18px;height:18px;color:var(--crimson)}
.charts-row{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:20px}
@media(max-width:768px){.charts-row{grid-template-columns:1fr}}
.chart-box{background:var(--card-bg);border:1px solid var(--border);border-radius:14px;padding:20px}
.chart-box h3{font-size:.85rem;font-weight:700;margin-bottom:14px}
.bar-chart{display:flex;flex-direction:column;gap:8px}
.bar-row{display:flex;align-items:center;gap:10px}
.bar-label{width:140px;font-size:.75rem;color:var(--text2);text-align:right;flex-shrink:0}
.bar-track{flex:1;height:28px;background:var(--surface2);border-radius:8px;overflow:hidden;position:relative}
.bar-fill{height:100%;border-radius:8px;display:flex;align-items:center;padding:0 8px;font-size:.72rem;font-weight:700;color:#fff;transition:width .6s ease}
.bar-val{font-size:.72rem;font-weight:700;width:40px;text-align:right;flex-shrink:0}
.legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:12px}
.legend-item{display:flex;align-items:center;gap:5px;font-size:.72rem;color:var(--text3)}
.legend-dot{width:10px;height:10px;border-radius:3px;flex-shrink:0}
.table-wrap{overflow-x:auto;margin-top:12px}
table{width:100%;border-collapse:collapse;font-size:.78rem}
th{background:var(--surface2);padding:10px 12px;text-align:left;font-weight:700;font-size:.72rem;text-transform:uppercase;letter-spacing:.04em;color:var(--text3);position:sticky;top:0}
td{padding:9px 12px;border-bottom:1px solid var(--border)}
tr:hover td{background:var(--hover)}
.badge{display:inline-block;padding:2px 8px;border-radius:12px;font-size:.68rem;font-weight:700}
.badge-green{background:#D1FAE5;color:#065F46}
.badge-red{background:#FEE2E2;color:#991B1B}
.badge-blue{background:#DBEAFE;color:#1E40AF}
.badge-orange{background:#FFEDD5;color:#9A3412}
.badge-purple{background:#EDE9FE;color:#5B21B6}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.filters select,.filters input{padding:7px 10px;border:1px solid var(--border);border-radius:8px;font-size:.8rem;background:var(--input-bg);color:var(--text)}
.filters label{font-size:.72rem;color:var(--text3);font-weight:600}
.risk-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:768px){.risk-grid{grid-template-columns:1fr}}
.risk-card{border-radius:12px;padding:16px;text-align:center}
.risk-card .rv{font-size:1.6rem;font-weight:800}
.risk-card .rl{font-size:.72rem;margin-top:4px}
.pie-container{display:flex;align-items:center;justify-content:center;gap:30px;flex-wrap:wrap}
.pie-legend{display:flex;flex-direction:column;gap:8px}
.pie-legend-item{display:flex;align-items:center;gap:8px;font-size:.8rem}
.pie-legend-dot{width:14px;height:14px;border-radius:4px;flex-shrink:0}
canvas{max-width:100%}
</style>
</head>

'<div class="legend-item"><div class="legend-dot" style="background:#EA580C"></div>Movilidad transversal ('+Math.round(difDir/totalRelaciones*100)+'%)</div></div></div>';

chart1HTML+='<div class="chart-box"><h3>Movilidad por Nivel</h3>'+
'<div class="bar-chart">'+
'<div class="bar-row"><div class="bar-label">Mismo Nivel</div><div class="bar-track"><div class="bar-fill" style="width:'+Math.round(mismoNivel/totalRelaciones*100)+'%;background:#0033A0"></div></div><div class="bar-val">'+mismoNivel+'</div></div>'+
'<div class="bar-row"><div class="bar-label">Mayor Nivel</div><div class="bar-track"><div class="bar-fill" style="width:'+Math.round(mayorNivel/totalRelaciones*100)+'%;background:#7C3AED"></div></div><div class="bar-val">'+mayorNivel+'</div></div>'+
'<div class="bar-row"><div class="bar-label">Menor Nivel</div><div class="bar-track"><div class="bar-fill" style="width:'+Math.round(menorNivel/totalRelaciones*100)+'%;background:#DC2626"></div></div><div class="bar-val">'+menorNivel+'</div></div>'+
'</div>'+
'<div class="legend"><div class="legend-item"><div class="legend-dot" style="background:#0033A0"></div>Movilidad horizontal ('+Math.round(mismoNivel/totalRelaciones*100)+'%)</div>'+
'<div class="legend-item"><div class="legend-dot" style="background:#7C3AED"></div>Promoción vertical ('+Math.round(mayorNivel/totalRelaciones*100)+'%)</div>'+
'<div class="legend-item"><div class="legend-dot" style="background:#DC2626"></div>Movilidad descendente ('+Math.round(menorNivel/totalRelaciones*100)+'%)</div></div></div>';
document.getElementById('charts1').innerHTML=chart1HTML;

/* ── DIRECTION + TIME CHARTS ──────────────────────────────────────── */
var dirArr=Object.entries(dirCount).sort(function(a,b){return b[1]-a[1]});
var dirBars=dirArr.map(function(d){return '<div class="bar-row"><div class="bar-label">'+esc(d[0].replace('Direccion ','Dir. ').replace('Unidad ','Un. '))+'</div><div class="bar-track"><div class="bar-fill" style="width:'+Math.round(d[1]/totalRelaciones*100)+'%;background:linear-gradient(90deg,#7C1D24,#E21836)"></div></div><div class="bar-val">'+d[1]+'</div></div>';}).join('');

var tiempoCount={};
RAW.forEach(function(r){var t=r['TIEMPO DE ALISTAMIENTO']||'Sin definir';tiempoCount[t]=(tiempoCount[t]||0)+1;});
var tiempoArr=Object.entries(tiempoCount).sort(function(a,b){return b[1]-a[1]});
var tiempoBars=tiempoArr.map(function(t){
  var color=t[0]==='1 AÑO'?'#059669':t[0]==='2 AÑOS'?'#0033A0':t[0]==='3 AÑOS'?'#EA580C':'#9CA3AF';
  return '<div class="bar-row"><div class="bar-label">'+esc(t[0])+'</div><div class="bar-track"><div class="bar-fill" style="width:'+Math.round(t[1]/totalRelaciones*100)+'%;background:'+color+'"></div></div><div class="bar-val">'+t[1]+'</div></div>';
}).join('');

var chart2HTML='<div class="chart-box"><h3>Relaciones por Dirección del Titular</h3>'+
'<div class="bar-chart">'+dirBars+'</div></div>'+
'<div class="chart-box"><h3>Tiempo de Alistamiento</h3>'+
'<div class="bar-chart">'+tiempoBars+'</div></div>';
document.getElementById('charts2').innerHTML=chart2HTML;

/* ── RISK MAP ─────────────────────────────────────────────────────── */
var riskAlta=0,riskMedia=0,riskBaja=0;
Object.values(jefes).forEach(function(j){
  var maxEdad=Math.max.apply(null,j.sucesores.map(function(s){return s.edad||0}).concat([0]));
  var minAnt=Math.min.apply(null,j.sucesores.map(function(s){return s.antiguedad||99}).concat([99]));
  if(j.edad>=55||minAnt<=1) riskAlta++;
  else if(j.edad>=45||minAnt<=3) riskMedia++;
  else riskBaja++;
});

var riskHTML='<h2><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg> Mapa de Riesgo de Sucesión</h2>'+
'<div class="risk-grid">'+
'<div class="risk-card" style="background:#FEE2E2;color:#991B1B"><div class="rv">'+riskAlta+'</div><div class="rl">Riesgo Alto<br><small>Titular ≥55 años o sucesor con ≤1 año antigüedad</small></div></div>'+
'<div class="risk-card" style="background:#FFEDD5;color:#9A3412"><div class="rv">'+riskMedia+'</div><div class="rl">Riesgo Medio<br><small>Titular 45-54 años o sucesor con ≤3 años</small></div></div>'+
'<div class="risk-card" style="background:#D1FAE5;color:#065F46"><div class="rv">'+riskBaja+'</div><div class="rl">Riesgo Bajo<br><small>Titular &lt;45 años y sucesor estable</small></div></div>'+
'</div>';
document.getElementById('riskSection').innerHTML=riskHTML;

/* ── TABLE ────────────────────────────────────────────────────────── */
var tableRows=RAW.map(function(r){
  var dJ=r['DIRECCION COMITE '],dS=r['DIRECCION COMITE _1'];
  var nJ=r['FUNCION-NIVEL DE CARGO'],nS=r['FUNCION-NIVEL DE CARGO_1'];
  var movTipo=movLabel(dJ,dS,nJ,nS);
  var movBadge=movBadgeClass(dJ,dS,nJ,nS);
  var tiempos=r['TIEMPO DE ALISTAMIENTO']||'—';
  var riesgo=calcRiesgo(r);
  return '<tr data-dir="'+esc(dJ)+'" data-nivel="'+esc(nJ)+'">'+
    '<td><strong>'+esc(r['APELLIDOS Y NOMBRES  - JEFE'])+'</strong><br><small style="color:var(--text4)">'+esc(r['CARGO'])+'</small></td>'+
    '<td>'+esc(dJ)+'</td><td><span class="badge badge-blue">'+esc(nJ)+'</span></td>'+
    '<td>'+esc(r['EDAD'])+'</td>'+
    '<td><strong>'+esc(r['SUCESOR'])+'</strong><br><small style="color:var(--text4)">'+esc(r['CARGO SUCESOR'])+'</small></td>'+
    '<td>'+esc(dS)+'</td><td><span class="badge '+movBadge+'">'+movTipo+'</span></td>'+
    '<td>'+tiempos+'</td><td>'+esc(r['Edad']||'—')+'</td><td>'+esc(r['Antigüedad']!=null?r['Antigüedad']+' años':'—')+'</td>'+
    '<td><span class="badge '+riesgo.cls+'">'+riesgo.txt+'</span></td></tr>';
}).join('');

var tableHTML='<h2><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14,2 14,8 20,8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg> Detalle de Relaciones Titular → Sucesor</h2>'+
'<div class="filters">'+
'<div><label> Dirección</label><br><select id="fDir"><option value="">Todas</option></select></div>'+
'<div><label> Nivel</label><br><select id="fNivel"><option value="">Todos</option></select></div>'+
'<div style="flex:1"><label> Buscar</label><br><input type="text" id="fSearch" placeholder="Nombre del jefe o sucesor..."></div></div>'+
'<div class="table-wrap"><table><thead><tr>'+
'<th>Titular</th><th>Dirección</th><th>Nivel</th><th>Edad</th>'+
'<th>Sucesor</th><th>Dir. Sucesor</th><th>Movilidad</th>'+
'<th>Tiempo</th><th>Edad S.</th><th>Antigüedad</th><th>Riesgo</th>'+
'</tr></thead><tbody id="tbody">'+tableRows+'</tbody></table></div>';
document.getElementById('tableSection').innerHTML=tableHTML;

/* ── FILTERS ──────────────────────────────────────────────────────── */
var dirs=[...new Set(RAW.map(function(r){return r['DIRECCION COMITE ']}))].sort();
var nivels=[...new Set(RAW.map(function(r){return r['FUNCION-NIVEL DE CARGO']}))].sort();
dirs.forEach(function(d){document.getElementById('fDir').innerHTML+='<option value="'+esc(d)+'">'+esc(d)+'</option>';});
nivels.forEach(function(n){document.getElementById('fNivel').innerHTML+='<option value="'+esc(n)+'">'+esc(n)+'</option>';});

function applyFilters(){
  var dir=document.getElementById('fDir').value;
  var nivel=document.getElementById('fNivel').value;
  var q=document.getElementById('fSearch').value.toLowerCase();
  document.querySelectorAll('#tbody tr').forEach(function(tr){
    var show=true;
    if(dir&&tr.dataset.dir!==dir) show=false;
    if(nivel&&tr.dataset.nivel!==nivel) show=false;
    if(q&&tr.textContent.toLowerCase().indexOf(q)===-1) show=false;
    tr.style.display=show?'':'none';
  });
}
document.getElementById('fDir').addEventListener('change',applyFilters);
document.getElementById('fNivel').addEventListener('change',applyFilters);
document.getElementById('fSearch').addEventListener('input',applyFilters);

/* ── HELPERS ──────────────────────────────────────────────────────── */
function movLabel(dJ,dS,nJ,nS){
  if(dJ===dS&&nJ===nS) return 'Interna';
  if(dJ===dS) return 'Internnivel';
  if(nJ===nS) return 'Transversal';
  if(NIVEL_ORD[nS]>NIVEL_ORD[nJ]) return 'Promoción';
  return 'Descendente';
}
function movBadgeClass(dJ,dS,nJ,nS){
  if(dJ===dS&&nJ===nS) return 'badge-green';
  if(dJ===dS) return 'badge-blue';
  if(nJ===nS) return 'badge-orange';
  if(NIVEL_ORD[nS]>NIVEL_ORD[nJ]) return 'badge-purple';
  return 'badge-red';
}
function calcRiesgo(r){
  var ed=r['EDAD']||0;var ant=r['Antigüedad'];
  if(ed>=55||(ant!=null&&ant<=1)) return {txt:'Alto',cls:'badge-red'};
  if(ed>=45||(ant!=null&&ant<=3)) return {txt:'Medio',cls:'badge-orange'};
  return {txt:'Bajo',cls:'badge-green'};
}
</script>
