<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Ciclo de Talento · Sucesores — Claro Colombia</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔄</text></svg>">
<link rel="stylesheet" href="../data/nav.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
.wrap{max-width:1400px;margin:0 auto;padding:24px}

/* ── HERO ────────────────────────────────────────────────────────── */
.hero{background:linear-gradient(135deg,#0F172A 0%,#1E3A5F 50%,#7C1D24 100%);border-radius:20px;padding:36px 40px;margin-bottom:28px;color:#fff;position:relative;overflow:hidden}
.hero::before{content:'';position:absolute;top:-40px;right:-40px;width:200px;height:200px;border-radius:50%;background:rgba(255,255,255,.06)}
.hero h1{font-size:1.5rem;font-weight:800;margin-bottom:4px}
.hero p{font-size:.85rem;color:rgba(255,255,255,.7)}
.hero-kpis{display:flex;gap:20px;margin-top:20px;flex-wrap:wrap}
.hero-kpi{text-align:center;background:rgba(255,255,255,.1);border-radius:12px;padding:14px 22px;backdrop-filter:blur(4px)}
.hero-kpi .v{font-size:1.8rem;font-weight:800;line-height:1}
.hero-kpi .l{font-size:.65rem;color:rgba(255,255,255,.65);text-transform:uppercase;letter-spacing:.05em;margin-top:4px}

/* ── KPI ROW ─────────────────────────────────────────────────────── */
.kpi-row{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-bottom:24px}
@media(max-width:1000px){.kpi-row{grid-template-columns:repeat(3,1fr)}}
@media(max-width:600px){.kpi-row{grid-template-columns:repeat(2,1fr)}}
.kpi{border-radius:14px;padding:18px 16px;text-align:center;position:relative;overflow:hidden;transition:transform .2s}
.kpi:hover{transform:translateY(-3px)}
.kpi::after{content:'';position:absolute;top:-15px;right:-15px;width:60px;height:60px;border-radius:50%;background:rgba(255,255,255,.1)}
.kpi-val{font-size:1.9rem;font-weight:800;line-height:1}
.kpi-lbl{font-size:.68rem;font-weight:600;text-transform:uppercase;letter-spacing:.04em;margin-top:5px;opacity:.85}
.k1{background:linear-gradient(135deg,#7C1D24,#B91C1C);color:#fff}
.k2{background:linear-gradient(135deg,#1E3A5F,#2563EB);color:#fff}
.k3{background:linear-gradient(135deg,#064E3B,#059669);color:#fff}
.k4{background:linear-gradient(135deg,#7C2D12,#EA580C);color:#fff}
.k5{background:linear-gradient(135deg,#4C1D95,#7C3AED);color:#fff}

/* ── SECTION ─────────────────────────────────────────────────────── */
.sec{background:var(--card-bg);border:1px solid var(--border);border-radius:16px;padding:24px;margin-bottom:20px}
.sec-title{font-size:.95rem;font-weight:700;margin-bottom:18px;display:flex;align-items:center;gap:8px}
.sec-title .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}

/* ── CHARTS ──────────────────────────────────────────────────────── */
.charts2{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:20px}
@media(max-width:800px){.charts2{grid-template-columns:1fr}}
.chart-card{background:var(--surface,#F9FAFB);border:1px solid var(--border);border-radius:14px;padding:20px}
.chart-card h3{font-size:.8rem;font-weight:700;margin-bottom:14px;color:var(--text2)}
.donut-wrap{display:flex;align-items:center;justify-content:center;gap:24px;flex-wrap:wrap}
.donut-legend{display:flex;flex-direction:column;gap:8px}
.dl-item{display:flex;align-items:center;gap:8px;font-size:.76rem}
.dl-dot{width:10px;height:10px;border-radius:3px;flex-shrink:0}
.dl-val{font-weight:700;margin-left:auto;min-width:24px;text-align:right}

/* ── MOBILITY CARDS ──────────────────────────────────────────────── */
.mob-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:600px){.mob-grid{grid-template-columns:1fr}}
.mob-card{border-radius:14px;padding:22px;text-align:center;position:relative;overflow:hidden;transition:transform .2s}
.mob-card:hover{transform:scale(1.02)}
.mob-card::after{content:'';position:absolute;bottom:-20px;right:-20px;width:80px;height:80px;border-radius:50%;background:rgba(255,255,255,.1)}
.mob-v{font-size:2.4rem;font-weight:900;line-height:1;position:relative;z-index:1}
.mob-l{font-size:.82rem;font-weight:700;margin-top:6px;position:relative;z-index:1}
.mob-p{font-size:.72rem;opacity:.7;margin-top:3px;position:relative;z-index:1}
.mc-vert{background:linear-gradient(135deg,#EDE9FE,#C4B5FD);color:#5B21B6}
.mc-horiz{background:linear-gradient(135deg,#DBEAFE,#93C5FD);color:#1E40AF}

/* ── RISK + TIME ─────────────────────────────────────────────────── */
.risk-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
@media(max-width:700px){.risk-grid{grid-template-columns:1fr}}
.risk-card{border-radius:14px;padding:22px;text-align:center;position:relative;overflow:hidden;transition:transform .2s}
.risk-card:hover{transform:translateY(-2px)}
.risk-card::after{content:'';position:absolute;top:-20px;right:-20px;width:70px;height:70px;border-radius:50%;background:rgba(255,255,255,.12)}
.risk-v{font-size:2.2rem;font-weight:900;line-height:1;position:relative;z-index:1}
.risk-l{font-size:.78rem;font-weight:700;margin-top:6px;position:relative;z-index:1}
.risk-d{font-size:.68rem;opacity:.7;margin-top:4px;position:relative;z-index:1;line-height:1.3}
.ra{background:linear-gradient(135deg,#FEE2E2,#FECACA);color:#991B1B}
.rm{background:linear-gradient(135deg,#FFEDD5,#FED7AA);color:#9A3412}
.rb{background:linear-gradient(135deg,#D1FAE5,#A7F3D0);color:#065F46}

.time-cards{display:flex;gap:12px;flex-wrap:wrap}
.time-card{flex:1;min-width:120px;border-radius:12px;padding:16px;text-align:center}
.time-card .tv{font-size:1.6rem;font-weight:800}
.time-card .tl{font-size:.7rem;font-weight:600;margin-top:3px}
.t1{background:linear-gradient(135deg,#D1FAE5,#6EE7B7);color:#065F46}
.t2{background:linear-gradient(135deg,#DBEAFE,#93C5FD);color:#1E40AF}
.t3{background:linear-gradient(135deg,#FEF3C7,#FDE68A);color:#92400E}

/* ── FILTERS ─────────────────────────────────────────────────────── */
.filters{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;margin-bottom:14px}
.filters select,.filters input{padding:8px 12px;border:1.5px solid var(--border);border-radius:10px;font-size:.8rem;background:var(--card-bg);color:var(--text);outline:none;transition:border .15s}
.filters select:focus,.filters input:focus{border-color:#2563EB}
.filters label{font-size:.7rem;color:var(--text3);font-weight:600;margin-bottom:3px;display:block}

/* ── TABLE ───────────────────────────────────────────────────────── */
.tbl-wrap{overflow-x:auto;border-radius:12px;border:1px solid var(--border)}
table{width:100%;border-collapse:collapse;font-size:.78rem}
th{background:linear-gradient(135deg,#1E3A5F,#2563EB);color:#fff;padding:11px 14px;text-align:left;font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em;white-space:nowrap;border-right:1px solid rgba(255,255,255,.15)}
th:last-child{border-right:none}
td{padding:10px 14px;border-bottom:1px solid var(--border);border-right:1px solid var(--border)}
td:last-child{border-right:none}
tr:hover td{background:var(--hover)}
.badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:.68rem;font-weight:700;white-space:nowrap}
.bg-green{background:#D1FAE5;color:#065F46}
.bg-blue{background:#DBEAFE;color:#1E40AF}
.bg-orange{background:#FFEDD5;color:#9A3412}
.bg-purple{background:#EDE9FE;color:#5B21B6}
.bg-red{background:#FEE2E2;color:#991B1B}
.bg-gray{background:#F3F4F6;color:#374151}
.person-name{font-weight:600;font-size:.8rem}
.person-cargo{font-size:.7rem;color:var(--text4)}
</style>
</head>
<body>

<div class="wrap">
  <div class="hero" id="hero"></div>
  <div class="kpi-row" id="kpis"></div>
  <div class="charts2" id="charts1"></div>
  <div class="sec" id="mobSection"></div>
  <div class="sec" id="timeSection"></div>
  <div class="sec" id="riskSection"></div>
  <div class="sec" id="tableSection"></div>
</div>

<script src="../data/nav.js"></script>
<script>
var RAW=[];

document.addEventListener('DOMContentLoaded',function(){
  fetch('../data/sucesores_data.json').then(function(r){return r.json()}).then(function(d){RAW=d;render()}).catch(function(e){
    console.error('Error:',e);
  });
});

function render(){
var NL={'COMITÉ DIRECTIVO':3,'DIRECTOR (A)':2,'GERENTE':1};
function ini(n){return n.split(' ').filter(function(w){return w.length>2}).slice(0,2).map(function(w){return w[0]}).join('').toUpperCase()||n.slice(0,2).toUpperCase()}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function pct(v,t){return t?Math.round(v/t*100):0}

/* ── AGGREGATE ────────────────────────────────────────────────────── */
var jefes={};
RAW.forEach(function(r){
  var e=r['EXPEDIENTE'];
  if(!jefes[e]) jefes[e]={exp:e,nombre:r['APELLIDOS Y NOMBRES  - JEFE'],edad:r['EDAD'],cargo:r['CARGO'],dir:r['DIRECCION COMITE '],nivel:r['FUNCION-NIVEL DE CARGO'],sucesores:[]};
  jefes[e].sucesores.push({nombre:r['SUCESOR'],cargo:r['CARGO SUCESOR'],dir:r['DIRECCION COMITE _1'],nivel:r['FUNCION-NIVEL DE CARGO_1'],tiempo:r['TIEMPO DE ALISTAMIENTO'],edad:r['Edad'],antiguedad:r['Antigüedad']});
});
var totalJefes=Object.keys(jefes).length;
var totalRel=RAW.length;
var prom=(totalRel/totalJefes).toFixed(1);

/* Movilidad: Vertical = sucesor va a ocupar cargo del titular (nivel menor o igual) */
/* Horizontal = mismo nivel del titular */
var vertical=0,horizontal=0;
RAW.forEach(function(r){
  var nJ=NL[r['FUNCION-NIVEL DE CARGO']]||0;
  var nS=NL[r['FUNCION-NIVEL DE CARGO_1']]||0;
  if(nS<nJ) vertical++;
  else horizontal++;
});

/* Tiempo */
var tiempoCount={};
RAW.forEach(function(r){var t=r['TIEMPO DE ALISTAMIENTO'];if(t)tiempoCount[t]=(tiempoCount[t]||0)+1;});

/* Riesgo */
var riskAlta=0,riskMedia=0,riskBaja=0;
Object.values(jefes).forEach(function(j){
  var minAnt=Math.min.apply(null,j.sucesores.map(function(s){return s.antiguedad!=null?s.antiguedad:99}).concat([99]));
  if(j.edad>=55||minAnt<=1) riskAlta++;
  else if(j.edad>=45||minAnt<=3) riskMedia++;
  else riskBaja++;
});

/* Direcciones */
var dirCount={};
RAW.forEach(function(r){var d=r['DIRECCION COMITE '];dirCount[d]=(dirCount[d]||0)+1;});

/* ── HERO ─────────────────────────────────────────────────────────── */
document.getElementById('hero').innerHTML=
  '<h1>Ciclo de Talento · Movilidad y Disponibilidad</h1>'+
  '<p>Análisis de sucesores, movilidad vertical y horizontal, riesgo de sucesión</p>'+
  '<div class="hero-kpis">'+
  '<div class="hero-kpi"><div class="v">'+totalJefes+'</div><div class="l">Cargos Titulares</div></div>'+
  '<div class="hero-kpi"><div class="v">'+totalRel+'</div><div class="l">Relaciones</div></div>'+
  '<div class="hero-kpi"><div class="v">'+prom+'</div><div class="l">Sucesores/Cargo</div></div>'+
  '<div class="hero-kpi"><div class="v">100%</div><div class="l">Cobertura</div></div>'+
  '</div>';

/* ── KPIs ─────────────────────────────────────────────────────────── */
var k1=pct(vertical,totalRel);
var k2=pct(horizontal,totalRel);
var k3=pct(riskAlta,totalJefes);
var k4=pct(riskMedia,totalJefes);
document.getElementById('kpis').innerHTML=
  '<div class="kpi k1"><div class="kpi-val">'+vertical+'</div><div class="kpi-lbl">Vertical ('+k1+'%)</div></div>'+
  '<div class="kpi k2"><div class="kpi-val">'+horizontal+'</div><div class="kpi-lbl">Horizontal ('+k2+'%)</div></div>'+
  '<div class="kpi k3"><div class="kpi-val">'+riskAlta+'</div><div class="kpi-lbl">Riesgo Alto ('+k3+'%)</div></div>'+
  '<div class="kpi k4"><div class="kpi-val">'+riskMedia+'</div><div class="kpi-lbl">Riesgo Medio ('+k4+'%)</div></div>'+
  '<div class="kpi k5"><div class="kpi-val">'+riskBaja+'</div><div class="kpi-lbl">Riesgo Bajo</div></div>';

/* ── DONUTS ───────────────────────────────────────────────────────── */
function drawDonut(id,data,colors,size){
  var c=document.getElementById(id);if(!c)return;
  var ctx=c.getContext('2d');
  var cx=size/2,cy=size/2,r=size/2-8,inner=size/3.2;
  var total=data.reduce(function(a,b){return a+b.val},0);
  var start=-Math.PI/2;
  ctx.clearRect(0,0,size,size);
  data.forEach(function(d){
    if(d.val===0)return;
    var angle=(d.val/total)*Math.PI*2;
    ctx.beginPath();ctx.arc(cx,cy,r,start,start+angle);ctx.arc(cx,cy,inner,start+angle,start,true);ctx.closePath();
    ctx.fillStyle=d.color;ctx.fill();
    start+=angle;
  });
  var cs=getComputedStyle(document.body);
  ctx.fillStyle=cs.getPropertyValue('--text')||'#111827';
  ctx.font='bold '+size/6+'px Segoe UI,system-ui';ctx.textAlign='center';
  ctx.fillText(total,cx,cy+2);
  ctx.font=(size/11)+'px Segoe UI,system-ui';
  ctx.fillStyle=cs.getPropertyValue('--text3')||'#6B7280';
  ctx.fillText('relaciones',cx,cy+size/12);
}

var charts1HTML=
  '<div class="chart-card"><h3>📊 Movilidad por Tipo</h3>'+
  '<div class="donut-wrap">'+
  '<canvas id="donutMov" width="170" height="170"></canvas>'+
  '<div class="donut-legend">'+
  '<div class="dl-item"><div class="dl-dot" style="background:#7C3AED"></div>Vertical<div class="dl-val">'+vertical+' ('+k1+'%)</div></div>'+
  '<div class="dl-item"><div class="dl-dot" style="background:#2563EB"></div>Horizontal<div class="dl-val">'+horizontal+' ('+k2+'%)</div></div>'+
  '</div></div></div>'+
  '<div class="chart-card"><h3>📈 Relaciones por Dirección</h3>'+
  '<div class="donut-wrap">'+
  '<canvas id="donutDir" width="170" height="170"></canvas>'+
  '<div class="donut-legend" id="dirLegend"></div>'+
  '</div></div>';
document.getElementById('charts1').innerHTML=charts1HTML;

setTimeout(function(){
  drawDonut('donutMov',[{val:vertical,color:'#7C3AED'},{val:horizontal,color:'#2563EB'}],null,170);
  var dirArr=Object.entries(dirCount).sort(function(a,b){return b[1]-a[1]});
  var dirColors=['#7C1D24','#1E3A5F','#059669','#EA580C','#7C3AED','#0891B2'];
  var dirData=dirArr.map(function(d,i){return{val:d[1],color:dirColors[i%dirColors.length]}});
  drawDonut('donutDir',dirData,null,170);
  document.getElementById('dirLegend').innerHTML=dirArr.map(function(d,i){
    return '<div class="dl-item"><div class="dl-dot" style="background:'+dirColors[i%dirColors.length]+'"></div>'+esc(d[0].replace('Direccion ','Dir. '))+'<div class="dl-val">'+d[1]+'</div></div>';
  }).join('');
},100);

/* ── MOBILITY CARDS ──────────────────────────────────────────────── */
document.getElementById('mobSection').innerHTML=
  '<div class="sec-title"><div class="dot" style="background:#2563EB"></div>Análisis de Movilidad</div>'+
  '<div class="mob-grid">'+
  '<div class="mob-card mc-vert"><div class="mob-v">'+vertical+'</div><div class="mob-l">Movilidad Vertical</div><div class="mob-p">'+k1+'% — Sucesor va a ocupar el cargo del titular</div></div>'+
  '<div class="mob-card mc-horiz"><div class="mob-v">'+horizontal+'</div><div class="mob-l">Movilidad Horizontal</div><div class="mob-p">'+k2+'% — Sucesor en mismo nivel del titular</div></div>'+
  '</div>';

/* ── TIME + RISK ─────────────────────────────────────────────────── */
var tArr=Object.entries(tiempoCount).sort(function(a,b){return b[1]-a[1]});
var tClasses={'1 AÑO':'t1','2 AÑOS':'t2','3 AÑOS':'t3'};
var timeHTML=tArr.map(function(t){return '<div class="time-card '+(tClasses[t[0]]||'t1')+'"><div class="tv">'+t[1]+'</div><div class="tl">'+esc(t[0])+'</div></div>';}).join('');

document.getElementById('timeSection').innerHTML=
  '<div class="sec-title"><div class="dot" style="background:#EA580C"></div>Tiempo de Alistamiento</div>'+
  '<div class="time-cards">'+timeHTML+'</div>';

document.getElementById('riskSection').innerHTML=
  '<div class="sec-title"><div class="dot" style="background:#DC2626"></div>Mapa de Riesgo de Sucesión</div>'+
  '<div class="risk-grid">'+
  '<div class="risk-card ra"><div class="risk-v">'+riskAlta+'</div><div class="risk-l">Riesgo Alto ('+pct(riskAlta,totalJefes)+'%)</div><div class="risk-d">Titular ≥55 años o sucesor con ≤1 año</div></div>'+
  '<div class="risk-card rm"><div class="risk-v">'+riskMedia+'</div><div class="risk-l">Riesgo Medio ('+pct(riskMedia,totalJefes)+'%)</div><div class="risk-d">Titular 45-54 años o sucesor con ≤3 años</div></div>'+
  '<div class="risk-card rb"><div class="risk-v">'+riskBaja+'</div><div class="risk-l">Riesgo Bajo ('+pct(riskBaja,totalJefes)+'%)</div><div class="risk-d">Titular &lt;45 años y sucesor estable</div></div>'+
  '</div>';

/* ── TABLE ────────────────────────────────────────────────────────── */
function movTipo(r){
  var nJ=NL[r['FUNCION-NIVEL DE CARGO']]||0;
  var nS=NL[r['FUNCION-NIVEL DE CARGO_1']]||0;
  if(nS<nJ) return {txt:'Vertical',cls:'bg-purple'};
  return {txt:'Horizontal',cls:'bg-blue'};
}
function riesgoTxt(r){
  var ed=r['EDAD']||0;var ant=r['Antigüedad'];
  if(ed>=55||(ant!=null&&ant<=1)) return {txt:'Alto',cls:'bg-red'};
  if(ed>=45||(ant!=null&&ant<=3)) return {txt:'Medio',cls:'bg-orange'};
  return {txt:'Bajo',cls:'bg-green'};
}

var rows=RAW.map(function(r){
  var mt=movTipo(r);
  var rg=riesgoTxt(r);
  return '<tr data-dir="'+esc(r['DIRECCION COMITE '])+'" data-nivel="'+esc(r['FUNCION-NIVEL DE CARGO'])+'">'+
    '<td><div class="person-name">'+esc(r['APELLIDOS Y NOMBRES  - JEFE'])+'</div><div class="person-cargo">'+esc(r['CARGO'])+'</div></td>'+
    '<td>'+esc(r['DIRECCION COMITE '])+'</td>'+
    '<td>'+esc(r['EDAD'])+'</td>'+
    '<td><div class="person-name">'+esc(r['SUCESOR'])+'</div><div class="person-cargo">'+esc(r['CARGO SUCESOR'])+'</div></td>'+
    '<td>'+esc(r['DIRECCION COMITE _1'])+'</td>'+
    '<td><span class="badge '+mt.cls+'">'+mt.txt+'</span></td>'+
    '<td>'+(r['TIEMPO DE ALISTAMIENTO']?'<span class="badge bg-blue">'+esc(r['TIEMPO DE ALISTAMIENTO'])+'</span>':'—')+'</td>'+
    '<td>'+(r['Edad']!=null?esc(r['Edad']):'—')+'</td>'+
    '<td>'+(r['Antigüedad']!=null?r['Antigüedad']+'a':'—')+'</td>'+
    '<td><span class="badge '+rg.cls+'">'+rg.txt+'</span></td></tr>';
}).join('');

var dirs=[...new Set(RAW.map(function(r){return r['DIRECCION COMITE ']}))].sort();
var nivels=[...new Set(RAW.map(function(r){return r['FUNCION-NIVEL DE CARGO']}))].sort();
var dirOpts=dirs.map(function(d){return '<option value="'+esc(d)+'">'+esc(d)+'</option>'}).join('');
var nivOpts=nivels.map(function(n){return '<option value="'+esc(n)+'">'+esc(n)+'</option>'}).join('');

document.getElementById('tableSection').innerHTML=
  '<div class="sec-title"><div class="dot" style="background:#059669"></div>Detalle de Relaciones Titular → Sucesor</div>'+
  '<div class="filters">'+
  '<div><label>Dirección Comité</label><select id="fDir"><option value="">Todas</option>'+dirOpts+'</select></div>'+
  '<div><label>Función Nivel de Cargo</label><select id="fNivel"><option value="">Todos</option>'+nivOpts+'</select></div>'+
  '<div style="flex:1;min-width:180px"><label>Buscar</label><input type="text" id="fSearch" placeholder="Nombre del jefe o sucesor..." style="width:100%"></div></div>'+
  '<div class="tbl-wrap"><table><thead><tr>'+
  '<th>Titular</th><th>Dirección</th><th>Edad</th>'+
  '<th>Sucesor</th><th>Dir. Sucesor</th><th>Movilidad</th>'+
  '<th>Tiempo</th><th>Edad S.</th><th>Antig.</th><th>Riesgo</th>'+
  '</tr></thead><tbody>'+rows+'</tbody></table></div>';

function applyFilters(){
  var dir=document.getElementById('fDir').value;
  var nivel=document.getElementById('fNivel').value;
  var q=document.getElementById('fSearch').value.toLowerCase();
  document.querySelectorAll('#tableSection tbody tr').forEach(function(tr){
    var show=true;
    if(dir&&tr.dataset.dir!==dir) show=false;
    if(nivel&&tr.dataset.nivel!==nivel) show=false;
    if(q&&tr.textContent.toLowerCase().indexOf(q)===-1) show=false;
    tr.style.display=show?'':'none';
  });
}
document.getElementById('fDir').addEventListener('change',applyFilters);
document.getElementById('fNivel').addEventListener('change',applyFilters);
document.getElementById('fSearch').addEventListener('input',applyFilters);

}
</script>
