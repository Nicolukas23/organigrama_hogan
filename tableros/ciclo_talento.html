var NIVEL_ORDER = ['COMITÉ DIRECTIVO','DIRECTOR (A)','GERENTE'];
var TIEMPO_ORDER = ['LISTO YA','1 AÑO','2 AÑOS','3 AÑOS'];
var TIEMPO_RANK  = {'LISTO YA':0,'1 AÑO':1,'2 AÑOS':2,'3 AÑOS':3};

function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function pct(n,d){return d>0?Math.round(n/d*100):0;}
function titleCase(s){return String(s||'').replace(/\s+/g,' ').trim();}

function movType(r){
  if(!r.sNivel) return 'indef';
  return r.jNivel===r.sNivel ? 'horizontal' : 'vertical';
}
function movBadgeClass(t){
  if(t==='horizontal') return 'badge-blue';
  if(t==='vertical') return 'badge-purple';
  return 'badge-gray';
}
function movLabel(t){
  if(t==='horizontal') return 'Horizontal';
  if(t==='vertical') return 'Vertical';
  return 'Sin definir';
}

function groupByJefe(data){
  var jefes={};
  data.forEach(function(r){
    if(!jefes[r.exp]) jefes[r.exp]={exp:r.exp,nombre:r.jNombre,edad:r.jEdad,cargo:r.jCargo,dir:r.jDir,nivel:r.jNivel,sucesores:[]};
    jefes[r.exp].sucesores.push(r);
  });
  return jefes;
}

function riskOfJefe(jefe){
  var ranks=jefe.sucesores.map(function(s){return TIEMPO_RANK[s.tiempo];}).filter(function(x){return x!=null;});
  var minR=ranks.length?Math.min.apply(null,ranks):null;
  var edad=jefe.edad;
  if(edad>=55) return (minR!=null&&minR<=1)?'Media':'Alta';
  if(edad>=45) return (minR!=null&&minR<=1)?'Baja':'Media';
  return 'Baja';
}
function riskBadgeClass(t){return t==='Alta'?'badge-red':t==='Media'?'badge-orange':'badge-green';}

/* ── Native canvas donut (no external libs) ── */
function drawDonut(canvasId,data,colors,size,centerLabel){
  var canvas=document.getElementById(canvasId);
  if(!canvas) return;
  canvas.width=size; canvas.height=size;
  var ctx=canvas.getContext('2d');
  var cx=size/2,cy=size/2,r=size/2-8,inner=size/3.4;
  var total=data.reduce(function(a,b){return a+b;},0)||1;
  var start=-Math.PI/2;
  ctx.clearRect(0,0,size,size);
  data.forEach(function(v,i){
    var angle=(v/total)*Math.PI*2;
    if(v<=0) return;
    ctx.beginPath();
    ctx.arc(cx,cy,r,start,start+angle);
    ctx.arc(cx,cy,inner,start+angle,start,true);
    ctx.closePath();
    ctx.fillStyle=colors[i];
    ctx.fill();
    start+=angle;
  });
  var cs=getComputedStyle(document.body);
  ctx.fillStyle=cs.getPropertyValue('--text')||'#0F172A';
  ctx.font='bold '+Math.round(size/6.5)+'px Segoe UI,system-ui';
  ctx.textAlign='center';
  ctx.fillText(String(total),cx,cy-1);
  ctx.font=Math.round(size/13)+'px Segoe UI,system-ui';
  ctx.fillStyle=cs.getPropertyValue('--text-dim')||'#64748B';
  ctx.fillText(centerLabel||'total',cx,cy+size/13);
}

/* ── CSS animated horizontal bar list ── */
function barListHTML(items,colorFn){
  var max=Math.max.apply(null,items.map(function(it){return it.val;}))||1;
  return '<div class="anim-bars">'+items.map(function(it){
    var w=Math.max(20,Math.round(it.val/max*100));
    var txt=it.val+(it.pct!=null?' ('+it.pct+'%)':'')+(it.extra?' '+it.extra:'');
    return '<div class="anim-bar-row"><div class="anim-bar-label">'+esc(it.label)+'</div>'+
      '<div class="anim-bar-track"><div class="anim-bar-fill" style="width:'+w+'%;background:'+it.color+'">'+txt+'</div></div></div>';
  }).join('')+'</div>';
}

  var sameDir=0,diffDir=0;

  var tiempoDefinedTotal=Object.values(tiempoCount).reduce(function(a,b){return a+b;},0);
  var tiempoUndefined=totalRel-tiempoDefinedTotal;

  /* ── Riesgo (a nivel de cargo titular) ── */
  var riskCount={'Alta':0,'Media':0,'Baja':0};

    /* ── Cargos por Nivel ── */
  var nivelCount={};

  // El color del texto de las dádonas depende del tema y se fija al
  // pintar; si cambia (botón 🌓), hay que repintar o queda "pegado" al
  // color del tema anterior. Se quita el listener previo (render() se
  // vuelve a llamar en cada cambio de filtro) para no apilar handlers.
  document.removeEventListener('claro:theme-changed', window.__ciclo2ThemeHandler||function(){});
  window.__ciclo2ThemeHandler=redrawCharts;
  document.addEventListener('claro:theme-changed', window.__ciclo2ThemeHandler);

  /* ════════════════ RISK SECTION ════════════════ */
  document.getElementById('riskSection').innerHTML=
    '<div class="section-title"><div class="icon red">⚠️</div>Riesgo de Continuidad</div>'+
    '<div class="section-sub">Cruce entre la edad del titular y el tiempo de alistamiento del sucesor más próximo, como variables de contexto</div>'+
    '<div class="risk-grid">'+
    '<div class="risk-card risk-alta"><div class="risk-val">'+riskCount['Alta']+'</div><div class="risk-pct">'+pct(riskCount['Alta'],totalJefes)+'%</div><div class="risk-label">Riesgo Alto</div><div class="risk-desc">Titular ≥55 años sin sucesor con alistamiento en ≤1 año</div></div>'+
    '<div class="risk-card risk-media"><div class="risk-val">'+riskCount['Media']+'</div><div class="risk-pct">'+pct(riskCount['Media'],totalJefes)+'%</div><div class="risk-label">Riesgo Medio</div><div class="risk-desc">Titular 45-54 años, o ≥55 con sucesor listo en el corto plazo</div></div>'+
    '<div class="risk-card risk-baja"><div class="risk-val">'+riskCount['Baja']+'</div><div class="risk-pct">'+pct(riskCount['Baja'],totalJefes)+'%</div><div class="risk-label">Riesgo Bajo</div><div class="risk-desc">Titular &lt;45 años, o 45-54 con sucesor listo en ≤1 año</div></div>'+
    '</div>';

  /* ════════════════ TABLE ════════════════ */
  var rows=data.map(function(r){
    var jefe=jefesMap[r.exp];
    var mt=movType(r);
    var risk=riskOfJefe(jefe);
    return '<tr data-dir="'+esc(r.jDir)+'" data-nivel="'+esc(r.jNivel)+'">'+
      '<td><span class="person-name">'+esc(r.jNombre)+'</span><span class="person-cargo">'+esc(r.jCargo)+'</span></td>'+
      '<td><small>'+esc(r.jDir.replace('Direccion ','').replace('Dirección ',''))+'</small></td>'+
      '<td style="text-align:center">'+esc(r.jEdad)+'</td>'+
      '<td><span class="person-name">'+esc(r.sNombre)+'</span><span class="person-cargo">'+esc(r.sCargo)+'</span></td>'+
      '<td><small>'+esc(r.sDir.replace('Direccion ','').replace('Dirección ',''))+'</small></td>'+
      '<td><span class="badge '+movBadgeClass(mt)+'">'+movLabel(mt)+'</span></td>'+
      '<td style="text-align:center">'+(r.tiempo?'<span class="badge badge-blue">'+esc(r.tiempo)+'</span>':'<span class="badge badge-gray">Sin definir</span>')+'</td>'+
      '<td style="text-align:center">'+(r.sEdad!=null?esc(r.sEdad):'—')+'</td>'+
      '<td style="text-align:center">'+(r.sAntig!=null?esc(r.sAntig)+'a':'—')+'</td>'+
      '<td><span class="badge '+riskBadgeClass(risk)+'">'+risk+'</span></td></tr>';
  }).join('');

  document.getElementById('tableSection').innerHTML=
    '<div class="section-title"><div class="icon green">📋</div>Detalle de Relaciones Titular → Sucesor</div>'+
    '<div class="section-sub">'+totalRel+' relaciones mostradas</div>'+
    '<div class="mini-filters"><div style="flex:1;min-width:220px"><label>Buscar por nombre</label><input type="text" id="fSearch" placeholder="Nombre del titular o del sucesor..."></div></div>'+
    '<div class="table-wrap"><table><thead><tr>'+
    '<th>Titular</th><th>Dirección</th><th>Edad</th>'+
    '<th>Sucesor</th><th>Dir. Sucesor</th><th>Movilidad</th>'+
    '<th>Tiempo</th><th>Edad Sucesor</th><th>Antigüedad</th><th>Riesgo</th>'+
    '</tr></thead><tbody>'+rows+'</tbody></table></div>';

  var fSearch=document.getElementById('fSearch');
  fSearch.addEventListener('input',function(){
    var q=fSearch.value.toLowerCase();
    document.querySelectorAll('#tableSection tbody tr').forEach(function(tr){
      tr.style.display=(!q||tr.textContent.toLowerCase().indexOf(q)!==-1)?'':'none';
    });
  });
}

/* ════════════════════════════════════════════════════════════════════
   INIT + GLOBAL FILTERS
   ════════════════════════════════════════════════════════════════════ */
function init(){
  var dirs=[...new Set(RAW_ALL.map(function(r){return r.jDir;}))].sort();
  var nivelsPresent=[...new Set(RAW_ALL.map(function(r){return r.jNivel;}))];
  var nivels=NIVEL_ORDER.filter(function(n){return nivelsPresent.indexOf(n)!==-1;});

  var dirOpts=dirs.map(function(d){return '<option value="'+esc(d.trim())+'">'+esc(d.trim())+'</option>';}).join('');
  var nivOpts=nivels.map(function(n){return '<option value="'+esc(n.trim())+'">'+esc(n.trim())+'</option>';}).join('');

  document.getElementById('filterbar').innerHTML=
    '<div class="fgroup"><label>Dirección de Comité</label><select id="gfDir"><option value="">Todas las direcciones</option>'+dirOpts+'</select></div>'+
    '<div class="fgroup"><label>Nivel de Función de Cargo</label><select id="gfNivel"><option value="">Todos los niveles</option>'+nivOpts+'</select></div>'+
    '<button class="filter-reset" id="gfReset" type="button">✕ Limpiar filtros</button>'+
    '<div class="filter-count" id="gfCount"></div>';

  var gfDir=document.getElementById('gfDir'), gfNivel=document.getElementById('gfNivel'), gfCount=document.getElementById('gfCount');

  function applyGlobalFilters(){
    var dir=gfDir.value.trim(), nivel=gfNivel.value.trim();
    var filtered=RAW_ALL.filter(function(r){
      var rDir=(r.jDir||'').trim();
      var rNivel=(r.jNivel||'').trim();
      if(dir && rDir!==dir) return false;
      if(nivel && rNivel!==nivel) return false;
      return true;
    });
    gfCount.textContent='Mostrando '+filtered.length+' de '+RAW_ALL.length+' relaciones';
    render(filtered);
  }
  gfDir.addEventListener('change',applyGlobalFilters);
  gfNivel.addEventListener('change',applyGlobalFilters);
  document.getElementById('gfReset').addEventListener('click',function(){
    gfDir.value=''; gfNivel.value=''; applyGlobalFilters();
  });

  applyGlobalFilters();
}

if(document.readyState==='loading'){
  document.addEventListener('DOMContentLoaded',init);
}else{
  init();
}
</script>
</body>
</html>
